name: Kitob Pulsi kanali

on:
  schedule:
    # Toshkent 08,10,12,14,16,18-22 = UTC 03,05,07,09,11,13-17: kuniga 10 ta iqtibos. Har 20 daqiqada tekshiradi
    # (GitHub kechiksa ham o'sha soat ichida joylanadi), har bir ishga tushish 1 daqiqa atrofida.
    - cron: "5,25,45 3,5,7,9,11,13-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitob
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tashkent
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION_KITOB }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # eng yangi holat (takroriy postlar bo'lmasin)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bulut.txt
      - run: pip install -r requirements-bulut.txt
      - run: python bulut.py kitob
        timeout-minutes: 5
      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "kanal-bot"
          git config user.email "kanal-bot@users.noreply.github.com"
          git add kitob_state.json
          git diff --cached --quiet || git commit -m "kitob holati"
          git pull --rebase -X theirs || git rebase --abort
          git push
