name: Futbol Pulsi kanali

on:
  schedule:
    # Toshkent 8:00-22:59 = UTC 3:00-17:59. Ikki marta: biri o'tkazib yuborilsa, ikkinchisi joylaydi.
    - cron: "3,33 3-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanal
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tashkent
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      KANAL_YOQILGAN: "1"
      KANAL_MAVJUD: "1"
      KANAL_NOMI: "Futbol Pulsi 🔥"
      KANAL_USERNAME: futbolpulsi_uz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bulut.txt
      - run: pip install -r requirements-bulut.txt
      - run: python bulut.py
      - name: Holatni saqlash
        run: |
          git config user.name "kanal-bot"
          git config user.email "kanal-bot@users.noreply.github.com"
          git add kanal_state.json
          git diff --cached --quiet || git commit -m "kanal holati"
          git push
