name: Futbol Pulsi kanali

on:
  schedule:
    # Har 10 daqiqada, Toshkent 8:00-02:59 (UTC 3:00-21:59): postlar 8:00-23:00, kechki o'yinlar gollari tungacha.
    # Jonli o'yin bo'lsa, har bir ishga tushish ~9 daqiqa davomida har daqiqada gollarni tekshiradi.
    - cron: "*/10 3-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kanal
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tashkent
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
      KANAL_YOQILGAN: "1"
      KANAL_MAVJUD: "1"
      KANAL_NOMI: "Futbol Pulsi 🔥"
      KANAL_USERNAME: futbolpulsi_uz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bulut.txt
      - run: pip install -r requirements-bulut.txt
      - run: python bulut.py
      - name: Holatni saqlash
        run: |
          git config user.name "kanal-bot"
          git config user.email "kanal-bot@users.noreply.github.com"
          git add kanal_state.json
          git diff --cached --quiet || git commit -m "kanal holati"
          git push
