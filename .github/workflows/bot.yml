name: Reklama AI bot

on:
  schedule:
    # Kun bo'yi: har bir ishga tushish ~25 daqiqa xabarlarni kutadi, keyingisi navbatda turadi.
    # Telegram xabarlarni 24 soat saqlaydi - bo'shliq bo'lsa ham hech qaysi xabar yo'qolmaydi.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
      TZ: Asia/Tashkent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - run: python reklama_bot.py
        timeout-minutes: 30
